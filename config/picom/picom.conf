# ==============================================================================
# Picom Compositor Configuration — i3dots
# ==============================================================================
# Frosted-glass dual-kawase blur behind translucent windows (Kitty, Polybar,
# Rofi, Dunst, dots-media) with crisp sharp window corners (corner-radius = 0)
# matching the reference screenshots.

backend = "glx";
vsync = true;
use-damage = true;
glx-no-stencil = true;
glx-no-rebind-pixmap = true;

# --- Sharp Corners (matches tiled window frames in reference screenshots) ---
corner-radius = 0;

# --- Shadows (disabled for crisp flat frosted-glass frames) ---
shadow = false;

# --- Smooth Fading ---
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 4;

# --- Opacity ---
# Keep apps at 1.0 by default so browsers (Brave) and Spotify stay crisp;
# Kitty, Polybar, Rofi, Dunst and dots-media set their own RGBA background alpha.
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

# --- Frosted-Glass Blur (dual_kawase) ---
blur: {
    method = "dual_kawase";
    strength = 7;
    background = true;
    background-frame = false;
    background-fixed = true;
};

blur-background-exclude = [
    "window_type = 'desktop'",
    "class_g = 'slop'",
    "class_g = 'flameshot'",
    "_GTK_FRAME_EXTENTS@:c"
];

# --- Window Detection ---
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
unredir-if-possible = false;
