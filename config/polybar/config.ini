; ==============================================================================
; Polybar Configuration — i3dots (3 Floating Bottom Islands + Pywal)
; ==============================================================================
; Matches the reference screenshots:
;   - 3 independent floating translucent bottom pills (left 24%, center 25%, right 25%)
;   - 1px crisp light border, 3px corner radius, 26px height, 6px bottom offset
;   - Left:   cube launcher | ○ 1 | ○ 2 | ● 4 (filled circle + underline for focused)
;   - Center: active window title (clean empty pill on empty desktop)
;   - Right:  media | volume | clock | battery | wifi | bluetooth

include-file = ~/.cache/wal/polybar-colors.ini

[settings]
screenchange-reload = true
pseudo-transparency = false

; ------------------------------------------------------------------------------
; Shared Base Bar
; ------------------------------------------------------------------------------
[bar/base]
monitor = ${env:MONITOR:}
bottom = true
height = 26
offset-y = 6
radius = 3.0
fixed-center = true

override-redirect = true
wm-restack = i3

background = ${colors.background}
foreground = ${colors.foreground}

border-size = 1
border-color = ${colors.border}

line-size = 2
line-color = ${colors.foreground}

padding-left = 1
padding-right = 1
module-margin = 0

font-0 = "JetBrainsMono Nerd Font:size=9.5;2"
font-1 = "JetBrainsMono Nerd Font:size=11.5;3"

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

; ------------------------------------------------------------------------------
; Left Island (24% width, 1% left margin) — Cube Icon | Workspaces
; ------------------------------------------------------------------------------
[bar/left]
inherit = bar/base
width = 24%
offset-x = 1%
modules-left = launcher sep i3

; ------------------------------------------------------------------------------
; Center Island (25% width, centered at 37.5%) — Active Window Title
; ------------------------------------------------------------------------------
[bar/center]
inherit = bar/base
width = 25%
offset-x = 37.5%
modules-center = xwindow

; ------------------------------------------------------------------------------
; Right Island (25% width, 74% offset = 1% right margin) — Status Modules
; ------------------------------------------------------------------------------
[bar/right]
inherit = bar/base
width = 25%
offset-x = 74%
modules-center = ${env:POLYBAR_RIGHT_MODULES:media sep pulseaudio sep date sep battery sep wlan sep bluetooth}

; ==============================================================================
; MODULES
; ==============================================================================

[module/sep]
type = custom/text
format = |
format-foreground = ${colors.separator}
format-padding = 1

[module/launcher]
type = custom/text
format = %{T2}%{T-}
format-foreground = ${colors.accent}
format-padding = 1
click-left = rofi -show drun &
click-right = ~/.local/bin/dots-powermenu &

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = false
index-sort = true
enable-click = true
enable-scroll = true
wrapping-scroll = false
reverse-scroll = false

format = <label-state> <label-mode>

label-mode = %mode%
label-mode-padding = 1
label-mode-foreground = ${colors.background-solid}
label-mode-background = ${colors.accent}

label-focused = %{T2}%{F${colors.accent}}󰄯%{F-}%{T-} %index%
label-focused-foreground = ${colors.foreground}
label-focused-underline = ${colors.foreground}
label-focused-padding = 1

label-unfocused = %{T2}%{F${colors.accent}}󰄰%{F-}%{T-} %index%
label-unfocused-foreground = ${colors.foreground}
label-unfocused-padding = 1

label-visible = %{T2}%{F${colors.accent}}󰄯%{F-}%{T-} %index%
label-visible-foreground = ${colors.foreground}
label-visible-underline = ${colors.muted}
label-visible-padding = 1

label-urgent = %{T2}%{F${colors.urgent}}󰄯%{F-}%{T-} %index%
label-urgent-foreground = ${colors.urgent}
label-urgent-underline = ${colors.urgent}
label-urgent-padding = 1

label-separator = |
label-separator-foreground = ${colors.separator}
label-separator-padding = 0

[module/xwindow]
type = internal/xwindow
label = %title:0:44:...%
label-empty =
label-foreground = ${colors.foreground}

[module/media]
type = custom/text
format = %{T2}󰝚%{T-}
format-foreground = ${colors.accent}
click-left = ~/.local/bin/dots-media &
click-right = playerctl play-pause
scroll-up = playerctl next
scroll-down = playerctl previous

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
interval = 5

format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.foreground}

ramp-volume-0 = %{T2}%{T-}
ramp-volume-1 = %{T2}%{T-}
ramp-volume-2 = %{T2}%{T-}
ramp-volume-foreground = ${colors.accent}

format-muted = %{T2}%{F${colors.muted}}󰝟%{F-}%{T-} muted
format-muted-foreground = ${colors.muted}

click-right = pavucontrol &
click-middle = ~/.local/bin/dots-media &

[module/date]
type = internal/date
interval = 5
date = %H:%M
date-alt = %a %d %b %H:%M

format = %{T2}%{F${colors.accent}}%{F-}%{T-} <label>
label = %date%
label-foreground = ${colors.foreground}

[module/battery]
type = internal/battery
full-at = 99
low-at = 15
battery = ${env:POLYBAR_BATTERY:BAT0}
adapter = ${env:POLYBAR_ADAPTER:AC}
poll-interval = 15

format-full = %{T2}%{F${colors.accent}}󰄯%{F-}%{T-} <label-full>
label-full = Full - %percentage%%
label-full-foreground = ${colors.foreground}

format-charging = %{T2}%{F${colors.accent}}󰄯%{F-}%{T-} <label-charging>
label-charging = Chrg - %percentage%%
label-charging-foreground = ${colors.foreground}

format-discharging = %{T2}%{F${colors.accent}}󰄰%{F-}%{T-} <label-discharging>
label-discharging = %percentage%%
label-discharging-foreground = ${colors.foreground}

format-low = %{T2}%{F${colors.urgent}}󰄯%{F-}%{T-} <label-low>
label-low = Low - %percentage%%
label-low-foreground = ${colors.urgent}

[module/wlan]
type = internal/network
interface = ${env:POLYBAR_WLAN:wlan0}
interface-type = wireless
interval = 5

format-connected = %{A1:nm-connection-editor &:}%{T2}%{F${colors.accent}}%{F-}%{T-}%{A}
format-disconnected = %{A1:nm-connection-editor &:}%{T2}%{F${colors.muted}}󰤭%{F-}%{T-}%{A}

[module/eth]
type = internal/network
interface = ${env:POLYBAR_ETH:eth0}
interface-type = wired
interval = 5

format-connected = %{A1:nm-connection-editor &:}%{T2}%{F${colors.accent}}󰈀%{F-}%{T-}%{A}
format-disconnected = %{A1:nm-connection-editor &:}%{T2}%{F${colors.muted}}󰈂%{F-}%{T-}%{A}

[module/bluetooth]
type = custom/script
exec = ~/.local/bin/dots-bluetooth
interval = 5
click-left = blueman-manager &
click-right = ~/.local/bin/dots-bluetooth toggle
