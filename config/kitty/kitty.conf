# ==============================================================================
# Kitty Terminal Configuration — i3dots (Frosted Glass + Pywal)
# ==============================================================================
# Translucent background paired with picom dual-kawase blur replicates the
# frosted glass terminal panes (tty-clock, cava, shell) in the reference images.

# --- Fallback alpine-teal palette (overridden live by Pywal below) ---
foreground              #cdd8d5
background              #0b1518
cursor                  #cdd8d5
cursor_text_color       #0b1518
selection_foreground    #0b1518
selection_background    #cdd8d5

color0  #0b1518
color1  #6d807f
color2  #7b9391
color3  #8ea29f
color4  #5c777a
color5  #72878a
color6  #879f9d
color7  #cdd8d5
color8  #475b5e
color9  #829997
color10 #90aaa7
color11 #a3b7b4
color12 #6e8e91
color13 #869fa2
color14 #9bb4b2
color15 #e3ece9

# Dynamic Pywal colors (globinclude only accepts paths relative to the kitty
# config dir, so use include; dots-pywal always generates this file)
include ${HOME}/.cache/wal/kitty-colors.conf

# --- Font ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# --- Frosted Glass Translucency (composited by picom dual-kawase blur) ---
background_opacity         0.72
dynamic_background_opacity yes

# --- Layout & Behavior ---
window_padding_width    18
confirm_os_window_close 0
enable_audio_bell       no
sync_to_monitor         yes
allow_remote_control    yes

# --- Cursor (inherited preference from user's dotfiles) ---
cursor_shape              beam
cursor_beam_thickness     8
cursor_blink_interval     0.5
cursor_stop_blinking_after 0
cursor_shape_unfocused    unchanged
cursor_trail              1

# --- Scrollback & URLs ---
scrollback_lines 5000
detect_urls      yes
url_style        curly
